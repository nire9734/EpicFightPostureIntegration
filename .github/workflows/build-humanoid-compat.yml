name: Build

on:
  push:
    branches:
      - main
      - '3.0.1'
      - '3.0.2'
      - dev/multiloader
      - dev/vanilla-humanoid-ef-special-render
      - dev/spider-generalized-compat
      - dev/humanoid-retargeting
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        working-directory: forge-1.20.1
        run: chmod +x gradlew

      - name: Build
        working-directory: forge-1.20.1
        run: ./gradlew clean build --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v6
        with:
          name: epicfight-posture-integration
          path: forge-1.20.1/build/libs/*.jar
          if-no-files-found: error

  wrapper-smoke-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Windows Gradle bootstrap
        shell: cmd
        working-directory: forge-1.20.1
        run: gradlew.bat --version
