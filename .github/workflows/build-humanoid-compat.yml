name: Build HumanoidModel Compatibility

on:
  push:
    branches:
      - dev/vanilla-humanoid-model-compat
      - dev/vanilla-humanoid-model-compat-v2
      - dev/vanilla-humanoid-model-compat-v3
      - dev/vanilla-humanoid-model-compat-v4
      - dev/vanilla-humanoid-original-animation
      - dev/vanilla-humanoid-ef-special-render
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Dedicated server smoke test
        run: |
          mkdir -p run
          echo 'eula=true' > run/eula.txt
          ./gradlew runServer --stacktrace > /tmp/efpi-server.log 2>&1 &
          SERVER_PID=$!
          READY=0
          for i in $(seq 1 120); do
            if [ -f run/logs/latest.log ] && grep -q 'Done (' run/logs/latest.log; then
              READY=1
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          kill "$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true
          if [ "$READY" -ne 1 ]; then
            cat /tmp/efpi-server.log
            if [ -f run/logs/latest.log ]; then cat run/logs/latest.log; fi
            exit 1
          fi

      - name: Collect dedicated server logs
        if: always()
        run: |
          mkdir -p smoke-logs
          cp /tmp/efpi-server.log smoke-logs/gradle-runServer.log 2>/dev/null || true
          cp run/logs/latest.log smoke-logs/latest.log 2>/dev/null || true

      - name: Upload dedicated server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dedicated-server-smoke-logs
          path: smoke-logs/
          if-no-files-found: ignore

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: humanoid-ef-special-render-test
          path: build/libs/*.jar
          if-no-files-found: error
