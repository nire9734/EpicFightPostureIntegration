name: Build HumanoidModel Compatibility

on:
  push:
    branches:
      - dev/vanilla-humanoid-model-compat
      - dev/vanilla-humanoid-model-compat-v2
      - dev/vanilla-humanoid-model-compat-v3
      - dev/vanilla-humanoid-model-compat-v4
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: humanoid-model-compat-v4-skinning-test
          path: build/libs/*.jar
          if-no-files-found: error
