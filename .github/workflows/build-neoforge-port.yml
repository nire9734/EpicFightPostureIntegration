name: Multiloader pre-release verification

on:
  push:
    branches:
      - 'port/1.21.1-neoforge'
      - dev/multiloader
  pull_request:
    paths:
      - 'neoforge-1.21.1/**'
      - 'common/**'
      - 'forge-1.20.1/**'
      - '.github/workflows/build-neoforge-port.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  neoforge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build NeoForge port and run shared core tests
        run: gradle -p neoforge-1.21.1 --no-daemon clean build --stacktrace
      - name: Test Forge-NeoForge compatibility comparison
        run: python3 -m unittest discover -s tools -p 'test_compare_compatibility_reports.py' -v
      - name: Upload NeoForge pre-release test JAR
        uses: actions/upload-artifact@v6
        with:
          name: efpi-neoforge-1.21.1-test-build
          path: neoforge-1.21.1/build/libs/*.jar
          if-no-files-found: error

  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build Forge 3.0.2 and run shared core tests
        run: gradle -p forge-1.20.1 --no-daemon clean build --stacktrace
