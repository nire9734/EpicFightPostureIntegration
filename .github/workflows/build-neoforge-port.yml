name: Build (Forge + NeoForge)

on:
  push:
    branches:
      - main
      - '3.0.1'
      - '3.0.2'
      - dev/multiloader
      - 'dev/3.2.0'
      - dev/vanilla-humanoid-ef-special-render
      - dev/spider-generalized-compat
      - dev/humanoid-retargeting
      - 'port/1.21.1-neoforge'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forge:
    name: Forge 1.20.1 (Java 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle bootstrap executable
        run: chmod +x forge-1.20.1/gradlew
      - name: Build Forge and run tests
        working-directory: forge-1.20.1
        run: ./gradlew clean build --stacktrace
      - name: Upload Forge regression test results on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: forge-regression-test-results
          path: |
            forge-1.20.1/build/test-results/test/
            forge-1.20.1/build/reports/tests/test/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Forge JAR
        uses: actions/upload-artifact@v6
        with:
          name: epicfight-posture-integration-forge-1.20.1
          path: forge-1.20.1/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

  neoforge:
    name: NeoForge 1.21.1 (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Make Gradle bootstrap executable
        run: chmod +x neoforge-1.21.1/gradlew
      - name: Build NeoForge and run tests
        working-directory: neoforge-1.21.1
        run: ./gradlew clean build --stacktrace
      - name: Upload NeoForge regression test results on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: neoforge-regression-test-results
          path: |
            neoforge-1.21.1/build/test-results/test/
            neoforge-1.21.1/build/reports/tests/test/
          if-no-files-found: ignore
          retention-days: 14
      - name: Compare Forge and NeoForge compatibility report formats
        run: python3 -m unittest discover -s tools -p 'test_compare_compatibility_reports.py' -v
      - name: Upload NeoForge JAR
        uses: actions/upload-artifact@v6
        with:
          name: epicfight-posture-integration-neoforge-1.21.1
          path: neoforge-1.21.1/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

  windows-bootstrap:
    name: Windows Gradle bootstrap
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Forge Gradle 8.8 bootstrap
        shell: cmd
        working-directory: forge-1.20.1
        run: gradlew.bat --version
      - name: Verify NeoForge Gradle 9.2.1 bootstrap
        shell: cmd
        working-directory: neoforge-1.21.1
        run: gradlew.bat --version
