description='''
Adds server-authoritative posture, guard breaks, and Combat Evolution execution support to compatible Epic Fight entities while preserving their existing AI and normal rendering. Includes conservative automatic humanoid compatibility for Minecraft model layouts and supported GeckoLib and Lionfish/Citadel-style humanoid models, plus multiplayer synchronization, configurable posture scaling, and server-side compatibility switches. Framework-specific secondary rendering support varies and unsupported layouts fail closed.
'''

