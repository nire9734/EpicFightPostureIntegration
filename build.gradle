plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "epicfight-posture-integration"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {}
        server { args '--nogui' }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://www.cursemaven.com' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation fg.deobf("curse.maven:epic-fight-mod-${epic_fight_project}:${epic_fight_file}")
    implementation fg.deobf("curse.maven:combat-evolution-${combat_evolution_project}:${combat_evolution_file}")

    // Optional client compatibility. These libraries are not required at runtime;
    // their classes are only loaded when the corresponding mod is actually present.
    compileOnly fg.deobf("curse.maven:geckolib-388172:8285794")
    compileOnly fg.deobf("curse.maven:lionfish-api-1001614:8095554")

    testImplementation platform('org.junit:junit-bom:5.10.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

mixin {
    add sourceSets.main, 'epicfight_posture_integration.refmap.json'
    config 'epicfight_posture_integration.mixins.json'
}

tasks.named('processResources', ProcessResources).configure {
    def props = [
        mod_id: mod_id,
        mod_name: mod_name,
        mod_version: mod_version,
        mod_authors: mod_authors,
        mod_license: mod_license,
        minecraft_version: minecraft_version,
        forge_version: forge_version
    ]
    inputs.properties props
    filesMatching(['META-INF/mods.toml']) {
        expand props
    }
}

tasks.named('jar', Jar).configure {
    from('LICENSE') {
        rename { "LICENSE_${mod_id}" }
    }

    manifest {
        attributes([
            'Specification-Title'   : mod_id,
            'Specification-Vendor'  : mod_authors,
            'Specification-Version' : mod_version,
            'Implementation-Title'  : mod_name,
            'Implementation-Version': mod_version,
            'Implementation-Vendor' : mod_authors,
            'MixinConfigs'          : 'epicfight_posture_integration.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.register('checkHumanoidCoreDependencies') {
    group = 'verification'
    description = 'Rejects platform/framework imports from the portable humanoid rig and skeleton core.'

    doLast {
        def coreDirectories = [
            file('src/main/java/dev/nire9734/epicfightposture/compat/humanoid/rig'),
            file('src/main/java/dev/nire9734/epicfightposture/compat/humanoid/skeleton')
        ]
        def forbiddenPrefixes = [
            'net.minecraft',
            'net.minecraftforge',
            'net.neoforged',
            'yesman.epicfight',
            'software.bernie',
            'mod.azure',
            'com.github.L_Ender'
        ]
        def violations = []

        coreDirectories.each { directory ->
            if (!directory.exists()) {
                return
            }
            fileTree(directory) {
                include '**/*.java'
            }.each { sourceFile ->
                sourceFile.eachLine('UTF-8') { line, lineNumber ->
                    String statement = line.trim()
                    String imported = null
                    if (statement.startsWith('import static ')) {
                        imported = statement.substring('import static '.length()).replace(';', '').trim()
                    } else if (statement.startsWith('import ')) {
                        imported = statement.substring('import '.length()).replace(';', '').trim()
                    }
                    if (imported == null) {
                        return
                    }
                    forbiddenPrefixes.each { prefix ->
                        if (imported == prefix || imported.startsWith(prefix + '.')) {
                            violations.add("${sourceFile}:$lineNumber imports ${imported}")
                        }
                    }
                }
            }
        }

        if (!violations.isEmpty()) {
            throw new GradleException(
                    'Portable humanoid core depends on platform/framework APIs:\n' + violations.join('\n')
            )
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('checkHumanoidCoreDependencies')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
