plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "epicfight-posture-integration"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {}
        server { args '--nogui' }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://www.cursemaven.com' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation fg.deobf("curse.maven:epic-fight-mod-${epic_fight_project}:${epic_fight_file}")
    implementation fg.deobf("curse.maven:combat-evolution-${combat_evolution_project}:${combat_evolution_file}")

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.named('processResources', ProcessResources).configure {
    def props = [
        mod_id: mod_id,
        mod_name: mod_name,
        mod_version: mod_version,
        mod_authors: mod_authors,
        mod_license: mod_license,
        minecraft_version: minecraft_version,
        forge_version: forge_version
    ]
    inputs.properties props
    filesMatching(['META-INF/mods.toml']) {
        expand props
    }
}

tasks.named('jar', Jar).configure {
    from('LICENSE') {
        rename { "LICENSE_${mod_id}" }
    }

    manifest {
        attributes([
            'Specification-Title'   : mod_id,
            'Specification-Vendor'  : mod_authors,
            'Specification-Version' : mod_version,
            'Implementation-Title'  : mod_name,
            'Implementation-Version': mod_version,
            'Implementation-Vendor' : mod_authors,
            'MixinConfigs'          : 'epicfight_posture_integration.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
