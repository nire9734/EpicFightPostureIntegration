modLoader="javafml"
loaderVersion="[1,)"
license="${mod_license}"
issueTrackerURL="${mod_issue_tracker_url}"

[[mixins]]
config="epicfight_posture_integration_neoforge.mixins.json"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="${mod_display_url}"
authors="${mod_authors}"
description='''
Adds server-authoritative posture, guard breaks, and Combat Evolution execution support to compatible Epic Fight entities. Includes automatic humanoid compatibility, HUD integration, configurable posture damage, and multiplayer synchronization.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[21.1.219,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="[1.21.1,1.21.2)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="epicfight"
type="required"
versionRange="[21.17.3.1,21.18)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="combat_evolution"
type="required"
versionRange="[2.3.2,2.4)"
ordering="AFTER"
side="BOTH"

# Optional. GeckoLib compatibility relies on GeckoLib 4.x internals (armor
# layer and armor renderer methods); a GeckoLib outside this range is refused
# at startup instead of failing when armor is first rendered.
[[dependencies.${mod_id}]]
modId="geckolib"
type="optional"
versionRange="[4.5,5)"
ordering="AFTER"
side="BOTH"
